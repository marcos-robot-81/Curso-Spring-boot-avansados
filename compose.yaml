version: "3.8"

services:
  # ---- DB -----
  db:
    container_name: Banco
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: abcd@1234
      MYSQL_DATABASE: procardio_db
    ports:
      - "3306:3306"
    networks:
      - rede-interna

  # ----- API ------
  api:
    container_name: Spring
    build:
      context: ./curso-spring-avancado/procardio-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/procardio_db?createDatabaseIfNotExist=true
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
    networks:
      - rede-interna

  # ----- Front-end --------
  front:
    container_name: front
    build:
      context: ./Front-end/front-cardio
      dockerfile: dockerfile
    ports:
      - "4200:4200"
    networks:
      - rede-interna

networks:
  rede-interna:
    driver: bridge

