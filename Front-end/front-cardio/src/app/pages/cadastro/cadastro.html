<div class="cadastro-container">
    <div class="card">
        <h2>Criar Conta</h2>

        <form [formGroup]="usuario" (ngSubmit)="cadastrar()">

            @if (mesagem) {
            <div class="mensagem" [class.erro]="mesagem.includes('Erro') || mesagem.includes('não conferem')"
                [class.sucesso]="mesagem.includes('sucesso')">
                {{ mesagem }}
            </div>
            }

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input id="nome" type="text" placeholder="Ex: João Silva" formControlName="nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" formControlName="email">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" placeholder="******" formControlName="senha">
                </div>
                <div class="form-group">
                    <label for="confimaSenha2">Confirmar Senha</label>
                    <input id="confimaSenha2" type="password" placeholder="******" formControlName="confimaSenha2">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cep">CEP</label>
                    <input id="cep" type="text" placeholder="00000-000" formControlName="cep"
                        (blur)="boscarEndereco(usuario.value.cep!)">
                </div>
                <div class="form-group small">
                    <label for="numero">Número</label>
                    <input id="numero" type="text" placeholder="Nº" formControlName="numero">
                </div>
            </div>

            <div class="form-group">
                <label for="complemento">Complemento</label>
                <input id="complemento" type="text" placeholder="Apto, Bloco, etc." formControlName="complemento">
            </div>

            <div class="form-group">
                <label for="perfil">Perfil de Acesso</label>
                <select id="perfil" formControlName="perfil">
                    <option value="">Selecione o perfil</option>
                    <option value="ROLE_ADMIN">Administrador</option>
                    <option value="ROLE_MEDICO">Médico</option>
                    <option value="ROLE_PACIENTE">Paciente</option>
                </select>
            </div>
            @if(usuario.value.perfil == 'ROLE_MEDICO'){
            <div class="form-group">
                <label for="Especialidade">Especialidade</label>
                    <select id="perfil" formControlName="Especialidade">  >
                        <option value="">Selecione a Especialidade</option>
                        <option value="Cardiologista">Cardiologista</option>
                        <option value="Dermatologista">Dermatologista</option>
                        <option value="Pediatra">Pediatra</option>
                        <option value="GINECOLOGIA">Ginecologia</option>
                        <option value="ORTOPEDIA">Ortopedia</option>

                    </select>
                
            </div>
            }

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</div>
