<div class="login-container">
  <div class="card">
    <h2>Acessar Conta</h2>

    <form [formGroup]="loginForm" (ngSubmit)="logar()">

      @if (mensagem) {
        <div class="mensagem" [class.erro]="mensagem.includes('Erro') || mensagem.includes('inválidos')" [class.sucesso]="mensagem.includes('sucesso')">
          {{ mensagem }}
        </div>
      }

      <div class="form-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" formControlName="email">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="******" formControlName="senha">
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Entrar</button>
    </form>
  </div>
</div>
